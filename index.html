<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Search App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    #searchInput {
      padding: 12px;
      width: 60%;
      max-width: 400px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 12px 20px;
      margin-left: 5px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    #status {
      margin: 20px;
      font-size: 18px;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);

      /* Polish: fade-in animation */
      animation: fadeIn 0.5s ease-in;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive fix for phones */
    @media (max-width: 600px) {
      #searchInput {
        width: 90%;
        margin-bottom: 10px;
      }

      button {
        margin-left: 0;
      }

      #results {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>Image Search App</h1>

  <input
    type="text"
    id="searchInput"
    placeholder="Search for images..."
  >

  <button onclick="searchImages()">Search</button>

  <div id="status"></div>

  <div id="results"></div>

  <script>

    async function searchImages() {

      const query = document.getElementById("searchInput").value.trim();
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      // Clear previous results
      results.innerHTML = "";

      if (query === "") {
        status.textContent = "Please enter something to search.";
        return;
      }

      // -------------------------
      // 1. LOADING STATE
      // -------------------------

      status.textContent = "🔎 Searching...";

      try {

        // Replace this URL with your actual API URL
        const response = await fetch(
          `https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=12&client_id=YOUR_ACCESS_KEY`
        );

        // Check whether request was successful
        if (!response.ok) {
          throw new Error("Request failed");
        }

        const data = await response.json();

        // Get result list
        const images = data.results;

        // -------------------------
        // 2. EMPTY STATE
        // -------------------------

        if (images.length === 0) {
          status.textContent =
            `No results for "${query}". Try another search.`;
          return;
        }

        // -------------------------
        // 3. RESULT COUNT
        // -------------------------

        status.textContent =
          `Showing ${images.length} results for "${query}"`;

        // Display images
        images.forEach(image => {

          const card = document.createElement("div");
          card.className = "card";

          card.innerHTML = `
            <img
              src="${image.urls.small}"
              alt="${image.alt_description || query}"
            >
          `;

          results.appendChild(card);
        });

      }

      // -------------------------
      // 4. ERROR STATE
      // -------------------------

      catch (error) {

        console.error(error);

        results.innerHTML = "";

        status.textContent =
          "Something went wrong. Please try again.";
      }
    }

  </script>

</body>
</html>
